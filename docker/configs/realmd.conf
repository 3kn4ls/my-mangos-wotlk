############################################
# MaNGOS realmd configuration file - Docker
############################################

[RealmdConf]
ConfVersion=2021031501

###################################################################################################################
# REALMD SETTINGS
###################################################################################################################

# Database connection - uses environment variables via Docker
# Default format: hostname;port;username;password;database
LoginDatabaseInfo = "database;3306;mangos;mangos;realmd"

# Logs directory
LogsDir = "/mangos/logs"

# Maximum database-ping interval (minutes between pings)
MaxPingTime = 30

# Port on which the server will listen
RealmServerPort = 3724

# Bind to all interfaces in container
BindIP = "0.0.0.0"

# Number of listener threads
ListenerThreads = 1

# PID file (optional in Docker)
PidFile = ""

# Logging settings
LogLevel = 2
LogTime = 1
LogFile = "Realmd.log"
LogTimestamp = 0
LogFileLevel = 2
LogColors = ""

# Process settings (not used in Linux containers)
UseProcessors = 0
ProcessPriority = 1

# Wait at startup error
WaitAtStartupError = 0

###################################################################################################################
# MYSQL SETTINGS
###################################################################################################################

# MySQL settings
MySQL.host = "database"
MySQL.port = "3306"
MySQL.username = "mangos"
MySQL.password = "mangos"
MySQL.database = "realmd"
MySQL.ssl = ""

###################################################################################################################
# WRONG PASSWORD PROTECTION
###################################################################################################################

WrongPass.MaxCount = 3
WrongPass.BanTime = 600
WrongPass.BanType = 0
WrongPass.Logging = 0
