#####################################
# MaNGOS Configuration file - Docker
#####################################

[MangosdConf]
ConfVersion=2024020101

###################################################################################################################
# CONNECTIONS AND DIRECTORIES
###################################################################################################################

# RealmID must match the realmlist inside the realmd database
RealmID = 1

# Data directory setting
DataDir = "/mangos/data"

# Logs directory
LogsDir = "/mangos/logs"

# Database connection settings - using Docker service names
LoginDatabaseInfo     = "database;3306;mangos;mangos;realmd"
WorldDatabaseInfo     = "database;3306;mangos;mangos;mangos"
CharacterDatabaseInfo = "database;3306;mangos;mangos;characters"
LogsDatabaseInfo      = "database;3306;mangos;mangos;mangos"

# Database connections
LoginDatabaseConnections = 1
WorldDatabaseConnections = 2
CharacterDatabaseConnections = 1
LogsDatabaseConnections = 1

# Maximum database-ping interval (minutes)
MaxPingTime = 30

# Port on which the server will listen
WorldServerPort = 8085

# Bind to all interfaces in container
BindIP = "0.0.0.0"

# SD2 Error Log File
SD2ErrorLogFile = "SD2Errors.log"

# Regenerates zone tables
Spawns.ZoneArea = 0

###################################################################################################################
# PERFORMANCE SETTINGS
###################################################################################################################

# Compression level for update packages (1-9)
Compression = 1

# Maximum number of players
PlayerLimit = 100

# Save respawn time immediately
SaveRespawnTimeImmediately = 1

# Maximum overspeed pings before kick
MaxOverspeedPings = 2

# Grid unload
GridUnload = 1

# Load all grids on maps (resource intensive)
LoadAllGridsOnMaps = ""

# Autoload active creatures
Autoload.Active = True

# Map update interval (milliseconds)
MapUpdateInterval = 100

# Change pickup distance
Visibility.RelocationLowerLimit.Air = 1.0
Visibility.RelocationLowerLimit.Ground = 0.1
Visibility.RelocationLowerLimit.Water = 0.1

###################################################################################################################
# LOGGING
###################################################################################################################

LogLevel = 2
LogTime = 1
LogFile = "Server.log"
LogTimestamp = 0
LogFileLevel = 2
LogFilter_TransportMoves = 1
LogFilter_CreatureMoves = 1
LogFilter_VisibilityChanges = 1
LogFilter_Weather = 1
LogFilter_DbStrictedCheck = 1
LogColors = ""
PidFile = ""
EnableLogDB = 0
DBLogLevel = 1
LogDB.Filter.CreatureMoves = 1
LogDB.Filter.TransportMoves = 1

