###################################
# PlayerBot Configuration
# Docker-optimized version
###################################

[PlayerbotConf]
ConfVersion=2023010101

###################################################################################################################
# PLAYERBOT SETTINGS
###################################################################################################################

# Enable PlayerBot system
AiPlayerbot.Enabled = 0

# Allow player bots
AiPlayerbot.AllowPlayerBots = 1

# Random bot mode
AiPlayerbot.RandomBotAutologin = 0
AiPlayerbot.MinRandomBots = 10
AiPlayerbot.MaxRandomBots = 50
AiPlayerbot.RandomBotUpdateInterval = 60
AiPlayerbot.RandomBotCountChangeMinInterval = 3600
AiPlayerbot.RandomBotCountChangeMaxInterval = 7200

# Random bot login
AiPlayerbot.RandomBotMinLevel = 1
AiPlayerbot.RandomBotMaxLevel = 80
AiPlayerbot.RandomBotLoginAtStartup = 1

# Bot behaviors
AiPlayerbot.BotActiveAlone = 50
AiPlayerbot.RandomBotShowHelmet = 1
AiPlayerbot.RandomBotShowCloak = 1

# Guild and group settings
AiPlayerbot.RandomBotJoinLfg = 1
AiPlayerbot.RandomBotJoinBG = 1
AiPlayerbot.RandomBotAutoJoinBG = 0
AiPlayerbot.RandomBotGuildNearby = 0.1

# Economy
AiPlayerbot.RandomBotAccountCount = 100
AiPlayerbot.DeleteRandomBotAccounts = 0

# Update interval
AiPlayerbot.RandomBotUpdateInterval = 60

# Performance
AiPlayerbot.IterationsPerTick = 10

# Chat
AiPlayerbot.EnableGreet = 1
AiPlayerbot.GlobalSpeakCooldown = 15

# Other settings
AiPlayerbot.SellGarbage = 1
AiPlayerbot.SyncQuestWithPlayer = 0
AiPlayerbot.SyncQuestForPlayer = 0
