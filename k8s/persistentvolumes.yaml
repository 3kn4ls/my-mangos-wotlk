---
# MySQL Data PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data-pvc
  namespace: mangos
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path  # K3s default storage class
---
# Realmd Logs PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: realmd-logs-pvc
  namespace: mangos
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
# Mangosd Logs PVC
apiVersion: v1
